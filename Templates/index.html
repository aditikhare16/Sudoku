<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <h1>Sudoku Game</h1>

    <div class="controls">
      <div class="difficulty-control">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
      </div>

      <button id="new-game">New Game</button>
      <button id="check-solution">Check Puzzle</button>
      <button id="hint-button">Hint</button>
      <button id="theme-toggle">Dark/Light Mode</button>
    </div>

    <div class="status-row">
      <span id="message">Loading puzzle...</span>
      <span id="timer">Time: 0:00</span>
    </div>

    <div class="board-wrapper">
      <div id="sudoku-board" class="sudoku-board" role="region" aria-label="Sudoku Board"></div>
    </div>

    <div class="leaderboard-panel">
      <h2>Top 10 Fastest Times</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Time</th>
              <th>Level</th>
              <th>Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
